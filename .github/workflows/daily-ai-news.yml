name: Daily AI News Digest

on:
  # NOTE: the `schedule:` trigger was removed on 2026-08-29. GitHub's scheduled
  # runs were firing 5-8 hours late (see git history), so cron now lives in the
  # backend container — server/scheduler.py. This workflow is kept for manual
  # runs and as a fallback if the internal scheduler is ever disabled.
  workflow_dispatch:
    inputs:
      hours:
        description: 'Time window in hours (1–168). Leave default for normal runs.'
        required: false
        default: '24'
      dry_run:
        description: 'Preview only — do not send the email'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # Summarization runs LLM calls for ~12 items via Zeabur; allow headroom
    # so a single slow publisher doesn't abort the whole job.
    timeout-minutes: 15
    steps:
      - name: Trigger backend digest endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}        # e.g. https://cct-backend.zeabur.app
          JOB_TOKEN:   ${{ secrets.JOB_TOKEN }}
          HOURS:       ${{ github.event.inputs.hours || '24' }}
          DRY_RUN:     ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL:-}" ] || [ -z "${JOB_TOKEN:-}" ]; then
            echo "::error::Missing BACKEND_URL or JOB_TOKEN secret"
            exit 1
          fi
          URL="${BACKEND_URL%/}/api/jobs/ai-news-digest?hours=${HOURS}&dry_run=${DRY_RUN}"
          echo "POST $URL"
          # Endpoint fetches articles + runs LLM summaries for ~12 items; allow
          # up to 10 minutes before giving up. --fail-with-body surfaces non-2xx
          # responses with their body for easier debugging.
          curl --fail-with-body -sS --max-time 600 -X POST \
            -H "Authorization: Bearer ${JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            "$URL" | tee response.json
          echo
          echo "Done."

      - name: Notify Lark on failure
        if: failure()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          set -euo pipefail
          [ -n "${LARK_WEBHOOK:-}" ] || { echo "No LARK_WEBHOOK secret; skipping alert."; exit 0; }
          TEXT="🔴 ${GITHUB_WORKFLOW} 执行失败\n仓库: ${GITHUB_REPOSITORY}\n查看: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n请检查后端服务是否正常。"
          curl -sS -X POST "$LARK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"msg_type":"text","content":{"text":"%s"}}' "$TEXT")" || true
