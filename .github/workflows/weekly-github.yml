name: Weekly GitHub AI Report

on:
  schedule:
    # 23:18 UTC Sunday = 07:18 Monday Beijing. Early + off-peak odd minute to
    # absorb GitHub's scheduler delay so it still lands ~Monday morning.
    - cron: '18 23 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many top repos (1-15)'
        required: false
        default: '5'
      dry_run:
        description: 'Preview only — do not send the email'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  send-weekly:
    runs-on: ubuntu-latest
    # README fetches + LLM detail generation for several repos; allow headroom.
    timeout-minutes: 15
    steps:
      - name: Trigger backend weekly GitHub endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          JOB_TOKEN:   ${{ secrets.JOB_TOKEN }}
          LIMIT:       ${{ github.event.inputs.limit || '5' }}
          DRY_RUN:     ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL:-}" ] || [ -z "${JOB_TOKEN:-}" ]; then
            echo "::error::Missing BACKEND_URL or JOB_TOKEN secret"
            exit 1
          fi
          URL="${BACKEND_URL%/}/api/jobs/github-weekly?limit=${LIMIT}&dry_run=${DRY_RUN}"
          echo "POST $URL"
          curl --fail-with-body -sS --max-time 600 -X POST \
            -H "Authorization: Bearer ${JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            "$URL" | tee response.json
          echo
          echo "Done."

      - name: Notify Lark on failure
        if: failure()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          set -euo pipefail
          [ -n "${LARK_WEBHOOK:-}" ] || { echo "No LARK_WEBHOOK secret; skipping alert."; exit 0; }
          TEXT="🔴 ${GITHUB_WORKFLOW} 执行失败\n仓库: ${GITHUB_REPOSITORY}\n查看: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n请检查后端服务是否正常。"
          curl -sS -X POST "$LARK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"msg_type":"text","content":{"text":"%s"}}' "$TEXT")" || true
