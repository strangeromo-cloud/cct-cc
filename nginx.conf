server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    auth_basic "Migration Review";
    auth_basic_user_file /etc/nginx/migration.htpasswd;

    location = /health {
        auth_basic off;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver __RESOLVER__ valid=30s;
        set $backend "http://cct-backend.railway.internal:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
